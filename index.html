<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Invitation | Sammy & Sangtris</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000817;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Image with Blur & Color Overlay */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: linear-gradient(
                135deg, 
                rgba(0, 8, 23, 0.9) 0%, 
                rgba(0, 41, 69, 0.85) 50%, 
                rgba(14, 116, 148, 0.75) 100%
            ), url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            transform: scale(1.1); /* Prevents white edges from blur */
        }

        /* App Container */
        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        .page {
            background: rgba(0, 8, 23, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(80, 165, 178, 0.2);
            transition: all 0.4s ease;
            position: relative; /* Base for animated assets */
        }

        /* Hidden class for transitions */
        .hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.97);
        }

        .fade-in {
            animation: fadeInPage 0.5s ease-out forwards;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Welcome Screen */
        .welcome-screen {
            text-align: center;
            padding: 16px 8px;
        }

        .welcome-badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(173, 105, 30, 0.2);
            border: 1px solid #AD691E;
            color: #E28E1C;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .welcome-screen h1 {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .welcome-screen p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Buttons */
        .primary-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #AD691E 0%, #E28E1C 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(226, 142, 28, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        /* Itinerary Screen */
        .header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(80, 165, 178, 0.15);
            margin-bottom: 22px;
        }

        .header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: #50A5B2;
            font-weight: 600;
        }

        /* Timeline Items */
        .timeline {
            position: relative;
            padding-left: 18px;
            margin-bottom: 24px;
            z-index: 10; /* Keep items above floating food */
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: linear-gradient(180deg, #0E7494, #E28E1C);
        }

        .step {
            position: relative;
            margin-bottom: 16px;
            background: rgba(0, 41, 69, 0.4);
            border: 1px solid rgba(80, 165, 178, 0.15);
            padding: 14px;
            border-radius: 14px;
        }

        .step::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #E28E1C;
            border: 3px solid #000817;
        }

        .time {
            font-size: 0.78rem;
            font-weight: 700;
            color: #E28E1C;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .title {
            font-size: 1rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .tag {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            background: rgba(14, 116, 148, 0.2);
            color: #50A5B2;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid rgba(80, 165, 178, 0.25);
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: #000000;
            border: none;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.2);
        }

        .whatsapp-btn:active {
            transform: scale(0.98);
        }

        /* Animated Floating Assets */
        .floating-asset {
            position: absolute;
            z-index: 5;
            pointer-events: none; /* Can't tap through items */
            opacity: 0.9;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
        }

        /* Vector Sangtris */
        .sangtris-asset {
            bottom: -50px;
            right: 10px;
            width: 160px;
            animation: bounce-sangtris 6s ease-in-out infinite;
        }

        /* Small Burger */
        .burger-asset {
            top: 60px;
            left: -30px;
            width: 50px;
            animation: bounce-food 5s ease-in-out infinite;
        }

        /* Small Cocktail */
        .cocktail-asset {
            bottom: 80px;
            left: -15px;
            width: 45px;
            animation: bounce-food 7s ease-in-out infinite reverse;
        }

        @keyframes bounce-sangtris {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(2deg); }
        }

        @keyframes bounce-food {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-10deg); }
        }

    </style>
</head>
<body>

    <!-- Blurred Background with Color Palette Overlay -->
    <div class="bg-container"></div>

    <div class="container">
        
        <!-- SCREEN 1: Welcome Invitation -->
        <div id="welcome-screen" class="page welcome-screen fade-in">
            <span class="welcome-badge">Saturday, 12 Sept 2026</span>
            <h1>A little market exploring, incredible food, and good conversation. 🍕 ✨</h1>
            <p>Here is everything lined up for us! Sammy</p>
            <button class="primary-btn" onclick="openItinerary()">
                View Date Itinerary
            </button>
        </div>

        <!-- SCREEN 2: Main Itinerary -->
        <div id="itinerary-screen" class="page hidden">
            
            <!-- Floating Animated Background Vector Assets (Integrated here) -->
            <img src="https://sangtris.github.io/sammy-date-plan/vector_sangtris_pose.png" alt="Sangtris Vector Portrait" class="floating-asset sangtris-asset">
            <img src="https://sangtris.github.io/sammy-date-plan/burger_icon.png" alt="Burger Icon" class="floating-asset burger-asset">
            <img src="https://sangtris.github.io/sammy-date-plan/cocktail_icon.png" alt="Cocktail Icon" class="floating-asset cocktail-asset">

            <div class="header">
                <h2>Pretoria Date Plan</h2>
                <p>Saturday, 12 September 2026</p>
            </div>

            <div class="timeline">
                
                <div class="step">
                    <div class="time">1:30 PM</div>
                    <div class="title">Meetup at Sammy Marks</div>
